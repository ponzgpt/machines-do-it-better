server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/xml image/svg+xml;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  error_page 404 /404.html;
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ =404; }
  location /_astro/ { expires 30d; add_header Cache-Control "public, immutable"; }
}
