server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  gzip on;
  gzip_types text/plain text/css text/markdown application/javascript application/xml image/svg+xml;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  error_page 404 /404.html;
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  # Spanish moved from /es/ to / on 2026-11-13; old links keep working.
  location = /es { return 301 /; }
  location = /es/ { return 301 /; }
  location ~ ^/es/(.*)$ { return 301 /$1; }

  # HTML must revalidate: without this, browsers keep showing the previous page after a deploy.
  # `expires` (not add_header) so the security headers above still apply here.
  location / { expires -1; try_files $uri $uri/ =404; }
  # The guide "for your agent": readable as text, UTF-8. default_type/charset, not add_header, for the same reason.
  location ~ \.md$ { expires -1; default_type text/markdown; charset utf-8; charset_types text/markdown; }
  location /_astro/ { expires 30d; add_header Cache-Control "public, immutable"; }
}
